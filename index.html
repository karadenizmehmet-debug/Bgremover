<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>e-Okul Fotoğraf Düzenleme Otomasyonu</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#4ade80;--err:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
  h1{font-size:1.3rem;margin:0 0 2px}
  .sub{color:var(--mut);font-size:.85rem;margin:0 0 16px}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{display:block;width:100%;text-align:center;background:var(--acc);color:#04202e;font-weight:700;border:0;border-radius:12px;padding:14px;font-size:1rem;cursor:pointer}
  .btn.sec{background:#334155;color:var(--txt)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline:1px solid var(--line)}
  .sw.on{border-color:var(--acc)}
  input[type=color]{width:46px;height:38px;border:0;background:none;padding:0}
  label.l{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
  input[type=range]{width:100%}
  select{width:100%;padding:10px;border-radius:10px;background:#0f172a;color:var(--txt);border:1px solid var(--line)}
  #bar{height:10px;background:#0f172a;border-radius:6px;overflow:hidden;margin-top:10px;display:none}
  #bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
  #msg{font-size:.85rem;color:var(--mut);margin-top:8px;min-height:1.2em}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .it{background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:.7rem;color:var(--mut)}
  .it .ph{aspect-ratio:133/171;background:#111827;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .it img{width:100%;height:100%;object-fit:contain}
  .it .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
  .it.ok .st{color:var(--ok)}.it.er .st{color:var(--err)}.it.ok.warn .st{color:#fbbf24}
  .chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:.9rem;color:var(--txt)}
  .chk input{margin-top:3px;width:18px;height:18px;flex:none}
  .chk small{display:block;color:var(--mut);font-size:.75rem}
  #warnBox{border-color:#a16207;background:#2a2008;font-size:.82rem;line-height:1.5}
  #warnBox b{color:#fbbf24}
  footer{text-align:center;color:var(--mut);font-size:.72rem;margin:18px 0}
  .it.ok{cursor:pointer}
  #ed{position:fixed;inset:0;background:rgba(2,6,23,.96);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
  #ed[hidden]{display:none}
  .edbox{width:100%;max-width:420px}
  .edtitle{font-size:.85rem;color:var(--mut);text-align:center;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .edview{position:relative;display:table;margin:0 auto}
  #edc{display:block;max-width:100%;max-height:56vh;touch-action:none;background:#fff;border-radius:6px;cursor:grab}
  .edview::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed rgba(56,189,248,.55);pointer-events:none}
  .edhint{font-size:.75rem;color:var(--mut);text-align:center;margin:8px 0 2px}
  .edbox .row .btn{flex:1;padding:12px}
  .edbox .row{margin-top:8px}
  /* Normal (açık) mod: varsayılan görünüm koyudur ve değişmez; yalnızca data-theme="light" iken geçerli */
  :root[data-theme="light"]{color-scheme:light;--bg:#f1f5f9;--card:#ffffff;--line:#d5dde8;--txt:#0f172a;--mut:#5b6b82;--ok:#15803d;--err:#dc2626}
  :root[data-theme="light"] .btn.sec{background:#e2e8f0}
  :root[data-theme="light"] select,:root[data-theme="light"] .it{background:#f8fafc}
  :root[data-theme="light"] #bar{background:#e2e8f0}
  :root[data-theme="light"] .it .ph{background:#e2e8f0}
  :root[data-theme="light"] .it.ok.warn .st{color:#b45309}
  :root[data-theme="light"] #warnBox{border-color:#d97706;background:#fef3c7}
  :root[data-theme="light"] #warnBox b{color:#92400e}
  :root[data-theme="light"] #ed{background:rgba(241,245,249,.97)}
  #temaDugme{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;margin:-6px 0 -6px 8px;vertical-align:middle;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:9px;cursor:pointer;font:inherit}
  #temaDugme svg{width:18px;height:18px;display:block}
</style>
</head>
<body>
<h1>e-Okul Fotoğraf Düzenleme Otomasyonu <small style="font-size:.7rem;font-weight:400;color:var(--mut);white-space:nowrap">v3.10</small><button type="button" id="temaDugme" aria-label="Normal moda geç"></button></h1>
<p class="sub">Arka planı değiştirir, yüzü ortalar, e-Okul boyutuna getirir. Her şey telefonda işlenir, fotoğraflar internete gönderilmez.</p>

<section>
  <label class="btn" for="file">📷 Fotoğrafları seç (en fazla 40)</label>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <div id="count" class="sub" style="margin:8px 0 0"></div>
</section>

<section>
  <div class="row" id="sw"></div>
  <label class="l">Özel renk</label>
  <input type="color" id="custom" value="#ffffff">

  <label class="l">Yakınlık: <b id="zv">100</b>%</label>
  <input type="range" id="zoom" min="80" max="130" step="5" value="100">

  <label class="l">Yüzün ortadan en fazla kayması: <b id="sv">16</b>%</label>
  <input type="range" id="shift" min="0" max="16" step="1" value="16">

  <label class="l">Yatay ortalama</label>
  <select id="hcenter">
    <option value="head" selected>Başa göre: kafanın sağı ve solu eşit (önerilen)</option>
    <option value="face">Yüze (gözlere) göre</option>
  </select>

  <label class="l">Dikey hizalama</label>
  <select id="align">
    <option value="eye" selected>Göz hizası hepsinde aynı</option>
    <option value="head">Baş üstü boşluğu hepsinde aynı</option>
  </select>

  <div id="headBox" hidden>
    <label class="l">Baş üstü boşluğu: <b id="hv">5</b>%</label>
    <input type="range" id="head" min="2" max="14" step="1" value="5">
  </div>
  <div id="eyeBox">
    <label class="l">Göz hizası (üstten): <b id="tv">38</b>%</label>
    <input type="range" id="top" min="30" max="48" step="1" value="38">
  </div>

  <label class="l">Model (hız / kalite)</label>
  <select id="model">
    <option value="rmbg" selected>RMBG (önerilen, hızlı)</option>
    <option value="isnet_fp16">Eski motor: Dengeli (yavaş)</option>
    <option value="isnet">Eski motor: En iyi kenar (yavaş)</option>
  </select>

  <label class="l">Çıktı boyutu</label>
  <select id="size">
    <option value="665x855">665 × 855 px (~140-148 KB, e-Okul kabul etmez)</option>
    <option value="532x684">532 × 684 px (~100-148 KB, e-Okul kabul etmez)</option>
    <option value="399x513">399 × 513 px (e-Okul kabul etmez)</option>
    <option value="133x171" selected>133 × 171 px (e-Okul: 35×45 mm, 20-150 KB)</option>
  </select>

  <label class="chk"><input type="checkbox" id="fx_defringe" checked><span>Kenar rengi temizleme<small>Saç ve omuz kenarındaki eski arka plan rengini siler. Yeni işlenen fotoğraflara uygulanır.</small></span></label>
  <label class="chk"><input type="checkbox" id="fx_expo" checked><span>Işık eşitleme (hafif)<small>Çok koyu ya da çok parlak çekilenleri grubun ortalamasına yaklaştırır. Cilt tonunu zorla eşitlemez, en fazla %10-12 düzeltir.</small></span></label>
  <label class="chk"><input type="checkbox" id="fx_sharp" checked><span>Hafif keskinleştirme<small>Küçültmeden sonra yüz detayını geri getirir.</small></span></label>
</section>

<section>
  <button class="btn" id="start" disabled>Başlat</button>
  <div id="bar"><i></i></div>
  <div id="msg"></div>
</section>

<section id="warnBox" hidden></section>

<section>
  <div id="grid"></div>
</section>

<section>
  <button class="btn" id="zip" disabled>⬇ Hepsini ZIP olarak indir</button>
  <div style="height:8px"></div>
  <button class="btn sec" id="share" disabled>📤 Paylaş / Galeriye kaydet</button>
</section>

<div id="ed" hidden>
  <div class="edbox">
    <div class="edtitle" id="edname"></div>
    <div class="edview"><canvas id="edc" width="399" height="513"></canvas></div>
    <div class="edhint">Sürükle: kaydır · İki parmak: yakınlaştır / uzaklaştır</div>
    <input type="range" id="edz" min="50" max="250" step="1" value="100">
    <div class="edhint" style="margin-top:10px">Döndürme: <b id="edrv">0.0</b>°</div>
    <input type="range" id="edr" min="-150" max="150" step="1" value="0">
    <div class="row">
      <button class="btn sec" id="edprev">‹</button>
      <button class="btn sec" id="edreset">Sıfırla</button>
      <button class="btn sec" id="edcancel">İptal</button>
      <button class="btn sec" id="ednext">›</button>
    </div>
    <div class="row"><button class="btn" id="edsave">Kaydet</button></div>
  </div>
</div>

<footer>Mehmet Karadeniz, 2026-2027</footer>

<script>
// Normal (açık) / koyu mod düğmesi. Seçim bu cihazda saklanır ("bgr-tema"); varsayılan koyu moddur.
(function () {
  var KEY = "bgr-tema", root = document.documentElement, b = document.getElementById("temaDugme"), meta = document.querySelector('meta[name="theme-color"]');
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function light() { return root.getAttribute("data-theme") === "light"; }
  function ui() {
    var l = light();
    b.innerHTML = l ? MOON : SUN;
    b.setAttribute("aria-label", l ? "Koyu moda geç" : "Normal moda geç");
    b.title = l ? "Koyu moda geç" : "Normal moda geç";
    if (meta) meta.setAttribute("content", l ? "#f1f5f9" : "#0f172a");
  }
  b.addEventListener("click", function () {
    var next = light() ? "dark" : "light";
    if (next === "light") root.setAttribute("data-theme", "light"); else root.removeAttribute("data-theme");
    try { localStorage.setItem(KEY, next); } catch (e) {}
    ui();
  });
  ui();
})();
</script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const COLORS = [["Beyaz","#ffffff"],["Açık gri","#e5e7eb"],["Açık mavi","#bfdbfe"],["Mavi","#5b8dd6"],["Gri-mavi","#cbd5e1"]];
  let bg = "#ffffff", items = [], removeBackground = null, preloadFn = null, cpuOnly = false, token = 0, busy = false;

  // ---------- renk seçimi ----------
  const swBox = $("#sw");
  COLORS.forEach(([n, c], i) => {
    const d = document.createElement("div");
    d.className = "sw" + (i === 0 ? " on" : ""); d.title = n; d.style.background = c;
    d.onclick = () => setBg(c); swBox.appendChild(d);
  });
  function setBg(c) {
    bg = c; $("#custom").value = c;
    [...swBox.children].forEach((d, i) => d.classList.toggle("on", COLORS[i][1] === c));
    schedule();
  }
  $("#custom").oninput = e => setBg(e.target.value);
  $("#zoom").oninput = e => { $("#zv").textContent = e.target.value; schedule(); };
  $("#top").oninput = e => { $("#tv").textContent = e.target.value; schedule(); };
  $("#shift").oninput = e => { $("#sv").textContent = e.target.value; schedule(); };
  $("#hcenter").onchange = schedule;
  $("#head").oninput = e => { $("#hv").textContent = e.target.value; schedule(); };
  $("#align").onchange = e => { const h = e.target.value === "head"; $("#headBox").hidden = !h; $("#eyeBox").hidden = h; schedule(); };
  $("#size").onchange = schedule;

  // kadraj ayarları bir sonraki açılışta hatırlanır
  const KEYS = ["zoom", "shift", "align", "hcenter", "head", "top"], EV = { align: "change", hcenter: "change" };
  const saveSet = () => { try { const o = {}; KEYS.forEach(k => o[k] = $("#" + k).value); localStorage.setItem("bgr-ayar2", JSON.stringify(o)); } catch (e) {} };
  try {
    const sv = JSON.parse(localStorage.getItem("bgr-ayar2") || "{}");
    KEYS.forEach(k => { if (sv[k] != null) { $("#" + k).value = sv[k]; $("#" + k).dispatchEvent(new Event(EV[k] || "input")); } });
  } catch (e) {}
  KEYS.forEach(k => $("#" + k).addEventListener(EV[k] || "input", saveSet));
  const CK = ["fx_defringe", "fx_expo", "fx_sharp"];
  try { const sv = JSON.parse(localStorage.getItem("bgr-ayar3") || "{}"); CK.forEach(k => { if (sv[k] != null) $("#" + k).checked = !!sv[k]; }); } catch (e) {}
  CK.forEach(k => $("#" + k).addEventListener("change", () => {
    try { const o = {}; CK.forEach(j => o[j] = $("#" + j).checked); localStorage.setItem("bgr-ayar3", JSON.stringify(o)); } catch (e) {}
    if (k === "fx_defringe") msg("Kenar rengi temizleme yalnız bundan sonra işlenen fotoğraflara uygulanır."); else schedule();
  }));

  // ---------- dosya seçimi ----------
  $("#file").onchange = e => {
    let files = [...e.target.files];
    if (files.length > 40) { files = files.slice(0, 40); msg("İlk 40 fotoğraf alındı."); }
    items.forEach(it => it.url && URL.revokeObjectURL(it.url));
    items = files.map(f => ({ file: f, name: f.name.replace(/\.[^.]+$/, "") + ".jpg", cut: null, info: null, blob: null, url: null, man: null }));
    const grid = $("#grid"); grid.innerHTML = "";
    items.forEach((it, i) => {
      const d = document.createElement("div"); d.className = "it";
      d.innerHTML = '<div class="ph">⏳</div><div class="nm"></div><div class="st">bekliyor</div>';
      d.querySelector(".nm").textContent = it.name; it.el = d; d.onclick = () => openEditor(it); grid.appendChild(d);
    });
    $("#count").textContent = items.length + " fotoğraf seçildi";
    $("#start").disabled = !items.length; $("#zip").disabled = true; $("#share").disabled = true;
  };

  function msg(t) { $("#msg").textContent = t; }
  function prog(p) { $("#bar").style.display = "block"; $("#bar i").style.width = Math.round(p * 100) + "%"; }
  function setSt(it, t, cls) { it.el.className = "it " + (cls || ""); it.el.querySelector(".st").textContent = t; }

  // ---------- kütüphane ----------
  async function loadLib() {
    if (removeBackground) return;
    msg("Model hazırlanıyor (ilk açılışta indirilir, biraz sürebilir)...");
    const m = await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm");
    removeBackground = m.removeBackground || m.default;
    preloadFn = m.preload || null;
  }
  let warmedModel = "";
  async function warm() {
    const model = $("#model").value;
    if (!preloadFn || warmedModel === model) return;
    try { await preloadFn({ model, device: cpuOnly ? "cpu" : "gpu", fetchArgs: { cache: "force-cache" }, progress: (k, c, t) => { if (t) msg("Model yükleniyor: %" + Math.round(c / t * 100)); } }); }
    catch (e) { console.warn("preload", e); }
    warmedModel = model;
  }
  async function cutout(blob) {
    if ($("#model").value === "rmbg") return rmbgCut(blob);
    const cfg = dev => ({
      model: $("#model").value, device: dev, output: { format: "image/png" }, fetchArgs: { cache: "force-cache" }
    });
    if (!cpuOnly) {
      try { return await removeBackground(blob, cfg("gpu")); }
      catch (e) { console.warn("GPU olmadı, CPU'ya geçiliyor", e); cpuOnly = true; }
    }
    return await removeBackground(blob, cfg("cpu"));
  }

  // ---------- RMBG-1.4 (transformers.js): oturum bir kez açılır, her fotoğraf hızlı işlenir ----------
  let tf = null, rmModel = null, rmProc = null, rmDev = "GPU";
  async function loadRmbg() {
    if (rmModel) return;
    msg("Model hazırlanıyor (ilk seferde indirilir, internet gerekir)...");
    tf = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2");
    const { AutoModel, AutoProcessor, env } = tf;
    env.allowLocalModels = false; env.useBrowserCache = true;
    const progress_callback = p => { if (p.status === "progress" && p.progress != null) msg("Model indiriliyor: %" + Math.round(p.progress)); };
    rmProc = await AutoProcessor.from_pretrained("briaai/RMBG-1.4", {
      config: { do_normalize: true, do_pad: false, do_rescale: true, do_resize: true, image_mean: [0.5, 0.5, 0.5],
        feature_extractor_type: "ImageFeatureExtractor", image_std: [1, 1, 1], resample: 2,
        rescale_factor: 0.00392156862745098, size: { width: 1024, height: 1024 } }
    });
    const tries = [["webgpu", "fp16", "GPU"], ["webgpu", "fp32", "GPU"], ["wasm", "q8", "CPU"]];
    let lastErr = null;
    for (const [device, dtype, label] of tries) {
      try {
        rmModel = await AutoModel.from_pretrained("briaai/RMBG-1.4", { config: { model_type: "custom" }, device, dtype, progress_callback });
        rmDev = label; return;
      } catch (e) { console.warn("RMBG yükleme", device, dtype, e); lastErr = e; }
    }
    throw lastErr;
  }
  async function rmbgCut(blob) {
    const { RawImage } = tf;
    const image = await RawImage.fromBlob(blob);
    const { pixel_values } = await rmProc(image);
    const out = await rmModel({ input: pixel_values });
    const t = out.output || Object.values(out)[0];
    const mask = await RawImage.fromTensor(t[0].mul(255).to("uint8")).resize(image.width, image.height);
    const bmp = await createImageBitmap(blob);
    const c = document.createElement("canvas"); c.width = image.width; c.height = image.height;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(bmp, 0, 0); if (bmp.close) bmp.close();
    const id = x.getImageData(0, 0, c.width, c.height), d = id.data, m = mask.data;
    // kenar yumuşatma: maskeye 3x3 bulanıklık (tırtıklı saç/omuz kenarını önler)
    const mw = c.width, mh = c.height, a = new Uint8ClampedArray(m.length);
    for (let y = 0; y < mh; y++) for (let i = 0; i < mw; i++) {
      let sum = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= mh) continue;
        for (let dx = -1; dx <= 1; dx++) { const xx = i + dx; if (xx < 0 || xx >= mw) continue; sum += m[yy * mw + xx]; n++; } }
      a[y * mw + i] = sum / n;
    }
    for (let i = 0; i < a.length; i++) d[i * 4 + 3] = a[i];
    x.putImageData(id, 0, 0);
    return new Promise(r => c.toBlob(r, "image/png"));
  }

  // ---------- hazırlık ----------
  async function prepare(file) {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    return new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
  }

  // maskeden baş üstü ve yatay merkez bulma
  function analyze(cut) {
    const sw = 160, sh = Math.max(1, Math.round(cut.height * sw / cut.width));
    const c = document.createElement("canvas"); c.width = sw; c.height = sh;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(cut, 0, 0, sw, sh);
    const d = x.getImageData(0, 0, sw, sh).data;
    const rows = new Array(sh).fill(0);
    for (let y = 0; y < sh; y++) { let n = 0; for (let i = 0; i < sw; i++) if (d[(y * sw + i) * 4 + 3] > 128) n++; rows[y] = n; }
    const minN = Math.max(3, sw * 0.03);
    let y0 = 0;
    for (; y0 < sh - 3; y0++) if (rows[y0] >= minN && rows[y0 + 1] >= minN && rows[y0 + 2] >= minN) break;
    const P = sh - y0;
    const yEnd = Math.min(sh, Math.round(y0 + P * 0.25));
    let sx = 0, n = 0;
    for (let y = y0; y < yEnd; y++) for (let i = 0; i < sw; i++) if (d[(y * sw + i) * 4 + 3] > 128) { sx += i; n++; }
    const k = cut.width / sw;

  // ---------- yüz noktaları (MediaPipe Face Landmarker) ----------
  const EYE_CHIN = 0.28;   // göz hizası ile çene arası, kare yüksekliğinin oranı (yakınlık %100)
  const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  let landmarker = null, faceTried = false;
  async function loadFace() {

  async function findFace(blob) {

  // Yüz bölgesinin netliği: 128 px genişliğe indirip Laplace varyansı (büyük = net). Çözünürlükten bağımsız kıyaslanır.
  function sharpness(cv, cx, cy, half) {
    const x0 = Math.max(0, Math.round(cx - half)), y0 = Math.max(0, Math.round(cy - half));
    const sw0 = Math.min(cv.width - x0, Math.round(half * 2)), sh0 = Math.min(cv.height - y0, Math.round(half * 2));
    if (sw0 < 16 || sh0 < 16) return 999;

    const c2 = document.createElement("canvas"); c2.width = w; c2.height = h;
    const x2 = c2.getContext("2d", { willReadFrequently: true }); x2.drawImage(cv, x0, y0, sw0, sh0, 0, 0, w, h);

  // Işık eşitleme için yüz bölgesinin ortalama parlaklığı (düşük çözünürlüklü kopyadan)
  function faceLum(it) {
    const m = it.info.low, { ex, ey, ec } = it.face;
    const xa = Math.max(0, Math.floor((ex - 0.5 * ec) / m.kx)), xb = Math.min(m.sw - 1, Math.floor((ex + 0.5 * ec) / m.kx));
    const ya = Math.max(0, Math.floor((ey - 0.3 * ec) / m.ky)), yb = Math.min(m.sh - 1, Math.floor((ey + 0.8 * ec) / m.ky));

  let blurMed = 0;
  // Grubun ortancasına göre her fotoğrafın parlaklık düzeltmesi (yarım güçte, en fazla -%10 / +%12) ve netlik ortancası
  function updateGains() {
    const L = items.filter(i => i.lum > 0).map(i => i.lum).sort((a, b) => a - b);
    const B = items.filter(i => i.face && i.face.q).map(i => i.face.q.blur).sort((a, b) => a - b);
    blurMed = B.length >= 3 ? B[B.length >> 1] : 0;

      if (Math.abs(g - 1) >= 0.03) it.gain = g;
    }
  }
  function warnsOf(it) {
    const w = [];

    const q = it.face.q; if (!q) return w;

    if (q.tilt > 0.17) w.push("baş eğik");
    if (q.jaw > 0.35) w.push("ağız açık");
    if (q.small < 0.07) w.push("yüz küçük/uzak");
    if (!it.man && it.gap >= 0.03) w.push("kenarda boşluk %" + Math.round(it.gap * 100));
    if (!it.man && Math.abs(it.headOff || 0) > 0.06) w.push("baş ortada değil");

  }
  function updateWarnBox() {

    bad.forEach(i => { const d = document.createElement("div"); d.textContent = i.name + " — " + warnsOf(i).join(", "); box.appendChild(d); });

  }

  // Kenar rengi temizleme: yarı saydam kenar pikselinin rengini, yakındaki tam opak (içerideki) piksellerin ortalamasına yaklaştırır.
  async function defringeBitmap(bm) {
    const w = bm.width, h = bm.height, c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(bm, 0, 0);
    const id = x.getImageData(0, 0, w, h), d = id.data, src = new Uint8ClampedArray(d), R = 3;
    for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {

  // Parlaklık düzeltmesi yalnız kişiye uygulanır (arka plan rengi değişmesin): önce şeffaf tuvale çiz, çarp, sonra arka plana koy.

  // Kadrajın fotoğrafın dışına taşıp kenarda boş (arka plan renkli) şerit bırakmasını önler:

  function fitFrame(face, w, h, W, H, zoom, eyePct, freeTop) {

  // man: elle düzeltme { dx, dy, z } — dx/dy kadraj boyutunun oranı (görüntünün kaydırılması), z yakınlık çarpanı. fast: önizleme (Lanczos yok).

  function openEditor(it) {
    if (busy || !it.blob || !it.cut) return;
    ed.it = it; ed.man = it.man ? { r: 0, ...it.man } : { dx: 0, dy: 0, z: 1, r: 0 }; ed.ptr.clear(); ed.prev = null;
    $("#edname").textContent = it.name;
    $("#ed").hidden = false; document.body.style.overflow = "hidden";
    edDraw();
  }
  function closeEditor() { $("#ed").hidden = true; document.body.style.overflow = ""; ed.it = null; ed.ptr.clear(); ed.prev = null; }
  async function edCommit() {
    const it = ed.it, m = ed.man;
    if (!it) return;
    const neutral = Math.abs(m.dx) < 0.002 && Math.abs(m.dy) < 0.002 && Math.abs(m.z - 1) < 0.005 && Math.abs(m.r || 0) < 0.0009;
    it.man = neutral ? null : { dx: m.dx, dy: m.dy, z: m.z, r: m.r || 0 };
    await renderItem(it);
  }
  async function edGo(step) {
    const it = ed.it; if (!it) return;
    await edCommit();
    const list = items.filter(i => i.blob), at = list.indexOf(it), nx = list[at + step];
    if (nx) openEditor(nx); else closeEditor();
  }
  $("#edsave").onclick = async () => { await edCommit(); closeEditor(); };
  $("#edcancel").onclick = closeEditor;
  $("#edreset").onclick = () => { ed.man = { dx: 0, dy: 0, z: 1, r: 0 }; edDraw(); };
  $("#edprev").onclick = () => edGo(-1);
  $("#ednext").onclick = () => edGo(1);
  $("#edr").oninput = e => { ed.man.r = e.target.value / 10 * Math.PI / 180; edSched(); };
  $("#edz").oninput = e => { ed.man.z = edClamp(e.target.value / 100, ZMIN, ZMAX); edSched(); };

  const edMetric = () => {
    const p = [...ed.ptr.values()]; if (!p.length) return null;
    return { n: p.length, cx: p.reduce((s, q) => s + q[0], 0) / p.length, cy: p.reduce((s, q) => s + q[1], 0) / p.length,
      d: p.length > 1 ? Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) : 0 };
  };
  edc.addEventListener("pointerdown", e => {
    if (!ed.it) return;
    try { edc.setPointerCapture(e.pointerId); } catch (_) {}
    ed.ptr.set(e.pointerId, [e.clientX, e.clientY]); ed.prev = edMetric();
  });
  edc.addEventListener("pointermove", e => {
    if (!ed.it || !ed.ptr.has(e.pointerId)) return;
    ed.ptr.set(e.pointerId, [e.clientX, e.clientY]);
    const m = edMetric(), p = ed.prev, r = edc.getBoundingClientRect();
    if (p && p.n === m.n && r.width > 0) {
      ed.man.dx = edClamp(ed.man.dx + (m.cx - p.cx) / r.width, -1, 1);
      ed.man.dy = edClamp(ed.man.dy + (m.cy - p.cy) / r.height, -1, 1);
      if (m.n > 1 && p.d > 0) ed.man.z = edClamp(ed.man.z * m.d / p.d, ZMIN, ZMAX);
    }
    ed.prev = m; edSched();
  });
  const edUp = e => { ed.ptr.delete(e.pointerId); ed.prev = edMetric(); };
  edc.addEventListener("pointerup", edUp);
  edc.addEventListener("pointercancel", edUp);
  edc.addEventListener("wheel", e => {
    if (!ed.it) return; e.preventDefault();
    ed.man.z = edClamp(ed.man.z * (e.deltaY < 0 ? 1.05 : 1 / 1.05), ZMIN, ZMAX); edSched();
  }, { passive: false });

  // ---------- ZIP (sıkıştırmasız) ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function makeZip(files) {
    const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
    const now = new Date();
    const dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
    const dd = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
    for (const f of files) {
      const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      const lh = new DataView(new ArrayBuffer(30 + nm.length));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
      lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
      new Uint8Array(lh.buffer).set(nm, 30);
      parts.push(new Uint8Array(lh.buffer), f.data);
      const ch = new DataView(new ArrayBuffer(46 + nm.length));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
      ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
      new Uint8Array(ch.buffer).set(nm, 46); cen.push(new Uint8Array(ch.buffer));
      off += lh.byteLength + sz;
    }
    const cs = cen.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cs, true); end.setUint32(16, off, true);
    return new Blob([...parts, ...cen, new Uint8Array(end.buffer)], { type: "application/zip" });
  }
  function uniqueName(n, used) {
    if (!used.has(n)) { used.add(n); return n; }
    const b = n.replace(/\.jpg$/, ""); let i = 2; while (used.has(b + "_" + i + ".jpg")) i++;
    const r = b + "_" + i + ".jpg"; used.add(r); return r;
  }

  $("#zip").onclick = async () => {
    const used = new Set(), files = [];
    for (const it of items) if (it.blob) files.push({ name: uniqueName(it.name, used), data: new Uint8Array(await it.blob.arrayBuffer()) });
    const bad = items.filter(i => i.blob && warnsOf(i).length);
    if (bad.length) files.push({ name: "yeniden_cekilecekler.txt", data: new TextEncoder().encode("Yeniden çekilmesi önerilenler (otomatik tahmin):\r\n" + bad.map(i => i.name + " - " + warnsOf(i).join(", ")).join("\r\n") + "\r\n") });
    const z = makeZip(files), a = document.createElement("a");
    a.href = URL.createObjectURL(z);
    a.download = "vesikalik_" + new Date().toISOString().slice(0, 10) + ".zip";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };

  $("#share").onclick = async () => {
    const used = new Set();
    const files = items.filter(i => i.blob).map(i => new File([i.blob], uniqueName(i.name, used), { type: "image/jpeg" }));
    try {
      if (navigator.canShare && navigator.canShare({ files })) await navigator.share({ files });
      else msg("Bu tarayıcı çoklu dosya paylaşımını desteklemiyor, ZIP'i kullan.");
    } catch (e) { if (e.name !== "AbortError") msg("Paylaşım hatası: " + e.message); }
  };
})();
</script>
</body>
</html>
