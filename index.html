<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Mehmet Karadeniz, 2026-2027">
<meta name="version" content="3.2">
<meta name="theme-color" content="#0f172a">
<title>Bgremover</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#4ade80;--err:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
  h1{font-size:1.3rem;margin:0 0 2px}
  .sub{color:var(--mut);font-size:.85rem;margin:0 0 16px}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{display:block;width:100%;text-align:center;background:var(--acc);color:#04202e;font-weight:700;border:0;border-radius:12px;padding:14px;font-size:1rem;cursor:pointer}
  .btn.sec{background:#334155;color:var(--txt)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline:1px solid var(--line)}
  .sw.on{border-color:var(--acc)}
  input[type=color]{width:46px;height:38px;border:0;background:none;padding:0}
  label.l{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
  input[type=range]{width:100%}
  select{width:100%;padding:10px;border-radius:10px;background:#0f172a;color:var(--txt);border:1px solid var(--line)}
  #bar{height:10px;background:#0f172a;border-radius:6px;overflow:hidden;margin-top:10px;display:none}
  #bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
  #msg{font-size:.85rem;color:var(--mut);margin-top:8px;min-height:1.2em}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .it{background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:.7rem;color:var(--mut)}
  .it .ph{aspect-ratio:133/171;background:#111827;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .it img{width:100%;height:100%;object-fit:contain}
  .it .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
  .it.ok .st{color:var(--ok)}.it.er .st{color:var(--err)}
  footer{text-align:center;color:var(--mut);font-size:.72rem;margin:18px 0}
</style>
</head>
<body>
<h1>Bgremover</h1>
<p class="sub">Arka planı değiştirir, yüzü ortalar, e-Okul boyutuna getirir. Her şey telefonda işlenir, fotoğraflar internete gönderilmez.</p>

<section>
  <label class="btn" for="file">📷 Fotoğrafları seç (en fazla 40)</label>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <div id="count" class="sub" style="margin:8px 0 0"></div>
</section>

<section>
  <div class="row" id="sw"></div>
  <label class="l">Özel renk</label>
  <input type="color" id="custom" value="#ffffff">

  <label class="l">Yakınlık: <b id="zv">100</b>%</label>
  <input type="range" id="zoom" min="80" max="130" step="5" value="100">

  <label class="l">Yüzün ortadan en fazla kayması: <b id="sv">4</b>%</label>
  <input type="range" id="shift" min="0" max="16" step="1" value="4">

  <label class="l">Yatay ortalama</label>
  <select id="hcenter">
    <option value="head" selected>Başa göre (saç / başörtüsü dahil)</option>
    <option value="face">Yüze (gözlere) göre</option>
  </select>

  <label class="l">Dikey hizalama</label>
  <select id="align">
    <option value="head" selected>Baş üstü boşluğu hepsinde aynı (önerilen)</option>
    <option value="eye">Göz hizası hepsinde aynı</option>
  </select>

  <div id="headBox">
    <label class="l">Baş üstü boşluğu: <b id="hv">5</b>%</label>
    <input type="range" id="head" min="2" max="14" step="1" value="5">
  </div>
  <div id="eyeBox" hidden>
    <label class="l">Göz hizası (üstten): <b id="tv">38</b>%</label>
    <input type="range" id="top" min="30" max="48" step="1" value="38">
  </div>

  <label class="l">Model (hız / kalite)</label>
  <select id="model">
    <option value="rmbg" selected>RMBG (önerilen, hızlı)</option>
    <option value="isnet_fp16">Eski motor: Dengeli (yavaş)</option>
    <option value="isnet">Eski motor: En iyi kenar (yavaş)</option>
  </select>

  <label class="l">Çıktı boyutu</label>
  <select id="size">
    <option value="665x855">665 × 855 px (~140-148 KB, e-Okul kabul etmez)</option>
    <option value="532x684">532 × 684 px (~100-148 KB, e-Okul kabul etmez)</option>
    <option value="399x513">399 × 513 px (e-Okul kabul etmez)</option>
    <option value="133x171" selected>133 × 171 px (e-Okul: 35×45 mm, 20-150 KB)</option>
  </select>
</section>

<section>
  <button class="btn" id="start" disabled>Başlat</button>
  <div id="bar"><i></i></div>
  <div id="msg"></div>
</section>

<section>
  <div id="grid"></div>
</section>

<section>
  <button class="btn" id="zip" disabled>⬇ Hepsini ZIP olarak indir</button>
  <div style="height:8px"></div>
  <button class="btn sec" id="share" disabled>📤 Paylaş / Galeriye kaydet</button>
</section>

<footer>Mehmet Karadeniz, 2026-2027 · v3.2</footer>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const COLORS = [["Beyaz","#ffffff"],["Açık gri","#e5e7eb"],["Açık mavi","#bfdbfe"],["Mavi","#5b8dd6"],["Gri-mavi","#cbd5e1"]];
  let bg = "#ffffff", items = [], removeBackground = null, preloadFn = null, cpuOnly = false, token = 0, busy = false;

  // ---------- renk seçimi ----------
  const swBox = $("#sw");
  COLORS.forEach(([n, c], i) => {
    const d = document.createElement("div");
    d.className = "sw" + (i === 0 ? " on" : ""); d.title = n; d.style.background = c;
    d.onclick = () => setBg(c); swBox.appendChild(d);
  });
  function setBg(c) {
    bg = c; $("#custom").value = c;
    [...swBox.children].forEach((d, i) => d.classList.toggle("on", COLORS[i][1] === c));
    schedule();
  }
  $("#custom").oninput = e => setBg(e.target.value);
  $("#zoom").oninput = e => { $("#zv").textContent = e.target.value; schedule(); };
  $("#top").oninput = e => { $("#tv").textContent = e.target.value; schedule(); };
  $("#shift").oninput = e => { $("#sv").textContent = e.target.value; schedule(); };
  $("#hcenter").onchange = schedule;
  $("#head").oninput = e => { $("#hv").textContent = e.target.value; schedule(); };
  $("#align").onchange = e => { const h = e.target.value === "head"; $("#headBox").hidden = !h; $("#eyeBox").hidden = h; schedule(); };
  $("#size").onchange = schedule;

  // ---------- dosya seçimi ----------
  $("#file").onchange = e => {
    let files = [...e.target.files];
    if (files.length > 40) { files = files.slice(0, 40); msg("İlk 40 fotoğraf alındı."); }
    items.forEach(it => it.url && URL.revokeObjectURL(it.url));
    items = files.map(f => ({ file: f, name: f.name.replace(/\.[^.]+$/, "") + ".jpg", cut: null, info: null, blob: null, url: null }));
    const grid = $("#grid"); grid.innerHTML = "";
    items.forEach((it, i) => {
      const d = document.createElement("div"); d.className = "it";
      d.innerHTML = '<div class="ph">⏳</div><div class="nm"></div><div class="st">bekliyor</div>';
      d.querySelector(".nm").textContent = it.name; it.el = d; grid.appendChild(d);
    });
    $("#count").textContent = items.length + " fotoğraf seçildi";
    $("#start").disabled = !items.length; $("#zip").disabled = true; $("#share").disabled = true;
  };

  function msg(t) { $("#msg").textContent = t; }
  function prog(p) { $("#bar").style.display = "block"; $("#bar i").style.width = Math.round(p * 100) + "%"; }
  function setSt(it, t, cls) { it.el.className = "it " + (cls || ""); it.el.querySelector(".st").textContent = t; }

  // ---------- kütüphane ----------
  async function loadLib() {
    if (removeBackground) return;
    msg("Model hazırlanıyor (ilk açılışta indirilir, biraz sürebilir)...");
    const m = await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm");
    removeBackground = m.removeBackground || m.default;
    preloadFn = m.preload || null;
  }
  let warmedModel = "";
  async function warm() {
    const model = $("#model").value;
    if (!preloadFn || warmedModel === model) return;
    try { await preloadFn({ model, device: cpuOnly ? "cpu" : "gpu", fetchArgs: { cache: "force-cache" }, progress: (k, c, t) => { if (t) msg("Model yükleniyor: %" + Math.round(c / t * 100)); } }); }
    catch (e) { console.warn("preload", e); }
    warmedModel = model;
  }
  async function cutout(blob) {
    if ($("#model").value === "rmbg") return rmbgCut(blob);
    const cfg = dev => ({
      model: $("#model").value, device: dev, output: { format: "image/png" }, fetchArgs: { cache: "force-cache" }
    });
    if (!cpuOnly) {
      try { return await removeBackground(blob, cfg("gpu")); }
      catch (e) { console.warn("GPU olmadı, CPU'ya geçiliyor", e); cpuOnly = true; }
    }
    return await removeBackground(blob, cfg("cpu"));
  }

  // ---------- RMBG-1.4 (transformers.js): oturum bir kez açılır, her fotoğraf hızlı işlenir ----------
  let tf = null, rmModel = null, rmProc = null, rmDev = "GPU";
  async function loadRmbg() {
    if (rmModel) return;
    msg("Model hazırlanıyor (ilk seferde indirilir, internet gerekir)...");
    tf = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2");
    const { AutoModel, AutoProcessor, env } = tf;
    env.allowLocalModels = false; env.useBrowserCache = true;
    const progress_callback = p => { if (p.status === "progress" && p.progress != null) msg("Model indiriliyor: %" + Math.round(p.progress)); };
    rmProc = await AutoProcessor.from_pretrained("briaai/RMBG-1.4", {
      config: { do_normalize: true, do_pad: false, do_rescale: true, do_resize: true, image_mean: [0.5, 0.5, 0.5],
        feature_extractor_type: "ImageFeatureExtractor", image_std: [1, 1, 1], resample: 2,
        rescale_factor: 0.00392156862745098, size: { width: 1024, height: 1024 } }
    });
    const tries = [["webgpu", "fp16", "GPU"], ["webgpu", "fp32", "GPU"], ["wasm", "q8", "CPU"]];
    let lastErr = null;
    for (const [device, dtype, label] of tries) {
      try {
        rmModel = await AutoModel.from_pretrained("briaai/RMBG-1.4", { config: { model_type: "custom" }, device, dtype, progress_callback });
        rmDev = label; return;
      } catch (e) { console.warn("RMBG yükleme", device, dtype, e); lastErr = e; }
    }
    throw lastErr;
  }
  async function rmbgCut(blob) {
    const { RawImage } = tf;
    const image = await RawImage.fromBlob(blob);
    const { pixel_values } = await rmProc(image);
    const out = await rmModel({ input: pixel_values });
    const t = out.output || Object.values(out)[0];
    const mask = await RawImage.fromTensor(t[0].mul(255).to("uint8")).resize(image.width, image.height);
    const bmp = await createImageBitmap(blob);
    const c = document.createElement("canvas"); c.width = image.width; c.height = image.height;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(bmp, 0, 0); if (bmp.close) bmp.close();
    const id = x.getImageData(0, 0, c.width, c.height), d = id.data, m = mask.data;
    // kenar yumuşatma: maskeye 3x3 bulanıklık (tırtıklı saç/omuz kenarını önler)
    const mw = c.width, mh = c.height, a = new Uint8ClampedArray(m.length);
    for (let y = 0; y < mh; y++) for (let i = 0; i < mw; i++) {
      let sum = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= mh) continue;
        for (let dx = -1; dx <= 1; dx++) { const xx = i + dx; if (xx < 0 || xx >= mw) continue; sum += m[yy * mw + xx]; n++; } }
      a[y * mw + i] = sum / n;
    }
    for (let i = 0; i < a.length; i++) d[i * 4 + 3] = a[i];
    x.putImageData(id, 0, 0);
    return new Promise(r => c.toBlob(r, "image/png"));
  }

  // ---------- hazırlık ----------
  async function prepare(file) {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    return new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
  }

  // maskeden baş üstü ve yatay merkez bulma
  function analyze(cut) {
    const sw = 160, sh = Math.max(1, Math.round(cut.height * sw / cut.width));
    const c = document.createElement("canvas"); c.width = sw; c.height = sh;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.drawImage(cut, 0, 0, sw, sh);
    const d = x.getImageData(0, 0, sw, sh).data;
    const rows = new Array(sh).fill(0);
    for (let y = 0; y < sh; y++) { let n = 0; for (let i = 0; i < sw; i++) if (d[(y * sw + i) * 4 + 3] > 128) n++; rows[y] = n; }
    const minN = Math.max(3, sw * 0.03);
    let y0 = 0;
    for (; y0 < sh - 3; y0++) if (rows[y0] >= minN && rows[y0 + 1] >= minN && rows[y0 + 2] >= minN) break;
    const P = sh - y0;
    const yEnd = Math.min(sh, Math.round(y0 + P * 0.25));
    let sx = 0, n = 0;
    for (let y = y0; y < yEnd; y++) for (let i = 0; i < sw; i++) if (d[(y * sw + i) * 4 + 3] > 128) { sx += i; n++; }
    const k = cut.width / sw;
    const lw = 320, lh = Math.max(1, Math.round(cut.height * lw / cut.width));   // kadraj boşluk ölçümü için orta çözünürlüklü kopya
    const lc = document.createElement("canvas"); lc.width = lw; lc.height = lh;
    const lx = lc.getContext("2d", { willReadFrequently: true }); lx.drawImage(cut, 0, 0, lw, lh);
    const low = { d: lx.getImageData(0, 0, lw, lh).data, sw: lw, sh: lh, kx: cut.width / lw, ky: cut.height / lh };
    const need = Math.max(4, Math.round(0.015 * lw)), alphaRow = r => { let c = 0; for (let i = 0; i < lw; i++) if (low.d[(r * lw + i) * 4 + 3] > 48) c++; return c; };   // yumuşak saç kenarı da görünür sayılır
    let tr = 0;                                                      // başın en üstü: art arda 3 satırda yeterli opak piksel
    for (; tr < lh - 3; tr++) if (alphaRow(tr) >= need && alphaRow(tr + 1) >= need && alphaRow(tr + 2) >= need) break;
    return { y0: y0 * k, P: Math.max(1, P * k), cx: (n ? sx / n : sw / 2) * k, low, top: tr * low.ky };
  }

  // ---------- yüz noktaları (MediaPipe Face Landmarker) ----------
  const EYE_CHIN = 0.28;   // göz hizası ile çene arası, kare yüksekliğinin oranı (yakınlık %100)
  const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  let landmarker = null, faceTried = false;
  async function loadFace() {
    if (landmarker || faceTried) return;
    faceTried = true;
    try {
      msg("Yüz modeli hazırlanıyor...");
      const { FaceLandmarker, FilesetResolver } = await import(MP + "/vision_bundle.mjs");
      const fs = await FilesetResolver.forVisionTasks(MP + "/wasm");
      const opts = d => ({ baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: d }, runningMode: "IMAGE", numFaces: 1 });
      // CPU: GPU'yu arka plan modeline bırak (ikisi aynı anda GPU kullanınca takılabiliyor)
      landmarker = await withTimeout(FaceLandmarker.createFromOptions(fs, opts("CPU")), 60000);
      faceErr = "";
    } catch (e) { console.warn("Yüz modeli yüklenemedi, silüet yöntemi kullanılacak", e); landmarker = null; faceErr = "yüz modeli yüklenemedi: " + (e && e.message || e); msg(faceErr); }
  }
  let faceErr = "";
  function withTimeout(pr, ms) {
    return Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error("zaman aşımı")), ms))]);
  }
  async function findFace(blob) {
    if (!landmarker) return null;
    const bmp = await createImageBitmap(blob);
    try {
      // yüz aramayı küçük kopyada yap (hızlı), koordinatları büyük görüntüye çevir
      const sc = Math.min(1, 720 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      const r = landmarker.detect(cv);
      const L = r.faceLandmarks && r.faceLandmarks[0];
      if (!L) return null;
      const w = bmp.width, h = bmp.height, P = i => [L[i].x * w, L[i].y * h];
      const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const eR = mid(P(33), P(133)), eL = mid(P(362), P(263));   // göz köşelerinin ortası
      const e = mid(eR, eL), chin = P(152);
      let ang = Math.atan2(eL[1] - eR[1], eL[0] - eR[0]);
      if (Math.abs(ang) > 0.2) ang = 0;                          // aşırı eğimde döndürme yapma
      const ec = Math.hypot(chin[0] - e[0], chin[1] - e[1]);
      if (!(ec > 10)) return null;
      return { ex: e[0], ey: e[1], ec, ang };
    } finally { if (bmp.close) bmp.close(); }
  }

  // Kadrajın fotoğrafın dışına taşıp kenarda boş (arka plan renkli) şerit bırakmasını önler:
  // önce kadrajı kaydırır, yetmezse biraz yakınlaştırır; eğim düzeltmesi sığmıyorsa eğimi uygulamaz.
  function fitFrame(face, w, h, W, H, zoom, eyePct, freeTop) {
    const { ex, ey, ec } = face;
    const k0 = (EYE_CHIN * zoom * H) / ec;               // çıktı pikseli / kaynak pikseli
    const place = (ang, g) => {
      const k = k0 * g, fw = W / k, fh = H / k, ca = Math.cos(ang), sa = Math.sin(ang);
      let loX = -Infinity, hiX = Infinity, loY = -Infinity, hiY = Infinity;
      for (const [ux, uy] of [[-fw / 2, -eyePct * fh], [fw / 2, -eyePct * fh], [-fw / 2, (1 - eyePct) * fh], [fw / 2, (1 - eyePct) * fh]]) {
        const rx = ca * ux - sa * uy, ry = sa * ux + ca * uy;   // kadraj köşesi, göze göre, kaynak pikselinde
        loX = Math.max(loX, -ex - rx); hiX = Math.min(hiX, w - ex - rx);
        if (!freeTop) loY = Math.max(loY, -ey - ry);                // üst boşluk serbestse kadraj fotoğrafın üstünden taşabilir (orası düz arka plan)
        hiY = Math.min(hiY, h - ey - ry);
      }
      if (loX > hiX || loY > hiY) return null;
      return { k, ang, loX, hiX, tx: Math.min(Math.max(0, loX), hiX), ty: Math.min(Math.max(0, loY), hiY) };
    };
    let r = null;
    if (face.ang) for (let i = 0; i <= 4 && !r; i++) r = place(face.ang, 1 + 0.02 * i);   // eğimi düzeltmek için en fazla %8 yakınlaş
    if (!r) r = place(0, Math.max(1, W / (k0 * w), freeTop ? 0 : H / (k0 * h)) * 1.0001);
    return r || { k: k0, ang: 0, tx: 0, ty: 0, loX: 0, hiX: 0 };
  }

  // Kadrajın alt kenarında, kenardan başlayan arka plan renkli şerit (omuz kadrajı doldurmuyor) oranını ölçer.
  // Gerçek piksellere bakar: şeffaf ya da arka plana benzeyen (beyaz vb.) pikseller boşluk sayılır. Eğim de hesaba katılır.
  function edgeGap(it, fr, W, H, eyePct) {
    const m = it.info.low, fw = W / fr.k, fh = H / fr.k, ca = Math.cos(fr.ang), sa = Math.sin(fr.ang);
    const cr = parseInt(bg.slice(1, 3), 16), cg = parseInt(bg.slice(3, 5), 16), cb = parseInt(bg.slice(5, 7), 16);
    const N = 96, ex = it.face.ex + fr.tx, ey = it.face.ey + fr.ty;
    let worst = 0;
    for (const off of [0.005, 0.03]) {                               // alt kenarın hemen üstündeki iki çizgi
      const like = [];
      for (let j = 0; j < N; j++) {
        const ux = (j + 0.5) / N * fw - fw / 2, uy = (1 - eyePct - off) * fh;
        const px = ex + ca * ux - sa * uy, py = ey + sa * ux + ca * uy;
        const i = Math.min(m.sw - 1, Math.max(0, Math.floor(px / m.kx))), k = Math.min(m.sh - 1, Math.max(0, Math.floor(py / m.ky))), p = (k * m.sw + i) * 4;
        const a = m.d[p + 3] / 255;
        const d = Math.abs(m.d[p] * a + cr * (1 - a) - cr) + Math.abs(m.d[p + 1] * a + cg * (1 - a) - cg) + Math.abs(m.d[p + 2] * a + cb * (1 - a) - cb);
        like.push(d <= 30);
      }
      let l = 0, r = 0;
      while (l < N && like[l]) l++;
      while (r < N && like[N - 1 - r]) r++;
      worst = Math.max(worst, l === N ? 1 : (l + r) / N);
    }
    return worst;
  }

  // Başın (saç / başörtüsü dahil) yatay orta noktası: baş üstünden gözlerin biraz altına kadar satırların sol-sağ uçlarının ortası
  function headCenter(it) {
    if (it.headCx != null) return it.headCx;
    const m = it.info.low, { ex, ey, ec } = it.face;
    const y0 = Math.floor(it.info.top / m.ky) + 2, y1 = Math.min(m.sh - 1, Math.floor((ey + 0.8 * ec) / m.ky)), mids = [];
    for (let y = y0; y <= y1; y++) {
      let a = -1, b = -1;
      for (let i = 0; i < m.sw; i++) if (m.d[(y * m.sw + i) * 4 + 3] > 48) { if (a < 0) a = i; b = i; }
      if (a >= 0 && b - a > 6) mids.push((a + b + 1) / 2 * m.kx);
    }
    mids.sort((p, q) => p - q);
    return (it.headCx = mids.length >= 5 ? mids[mids.length >> 1] : ex);
  }

  // Alt köşelerde boşluk varsa kadrajı en fazla shiftMax kadar kaydırır, yetmezse en fazla %24 yakınlaştırır (yüz ortada kalsın).
  // headT verilmişse (baş üstü boşluğu oranı) her fotoğrafta başın tepesi kadrajın üstünden aynı uzaklığa konur.
  function bestFrame(it, W, H, zoom, eyePct, headT, shiftMax, byHead) {
    const w = it.cut.width, h = it.cut.height, { ey, ec } = it.face;
    let best = null;
    for (let i = 0; i <= 12; i++) {
      const z = zoom * (1 + 0.02 * i);
      const eyeP = headT == null ? eyePct : Math.min(0.6, Math.max(0.2, headT + (ey - it.info.top) * EYE_CHIN * z / ec));   // göz hizası fotoğrafa göre değişir
      const fr = fitFrame(it.face, w, h, W, H, z, eyeP, headT != null), fw = W / fr.k, fh = H / fr.k;
      const pen = headT == null ? 0 : Math.max(0, -fr.ty / fh - 0.03);   // alt sınır yüzünden kadraj çok yukarı kayıp baş üstü boşluğunu bozmasın
      const base = byHead ? Math.min(Math.max(headCenter(it) - it.face.ex, -0.08 * fw), 0.08 * fw) : 0;   // yüz ortadan en fazla %8 kayar
      const tx0 = Math.min(Math.max(fr.tx + base, fr.loX), fr.hiX);
      let loc = null;
      for (const s of shiftMax > 0 ? [0, -shiftMax / 2, shiftMax / 2, -shiftMax, shiftMax] : [0]) {   // kaydırma, kadraj genişliğinin oranı (yüz ortada kalsın diye sınırlı)
        const tx = Math.min(Math.max(tx0 + s * fw, fr.loX), fr.hiX);
        const gap = edgeGap(it, { ...fr, tx }, W, H, eyeP), score = gap + pen;
        if (!loc || score < loc.score - 0.004) loc = { ...fr, tx, gap, score, eyePct: eyeP };
        if (loc.score <= 0.01) break;
      }
      if (!best || loc.score < best.score - 0.01) best = loc;        // her yakınlaşma en az %1 kazandırmalı
      if (best.score <= 0.01) break;
    }
    return best;
  }

  // ---------- kadraj + arka plan ----------
  function render(it, W, H) {
    const zoom = $("#zoom").value / 100, eyePct = $("#top").value / 100, headT = $("#align").value === "head" ? $("#head").value / 100 : null;
    let c = document.createElement("canvas"), x;
    if (it.face) {
      // Yüz noktalarına göre sabit kadraj: göz hizası ve göz-çene mesafesi her fotoğrafta aynı (kenara taşmadıkça)
      const { ex, ey } = it.face;
      const fr = bestFrame(it, W, H, zoom, eyePct, headT, $("#shift").value / 100, $("#hcenter").value === "head");
      const { k: kOut, ang, tx, ty } = fr; it.gap = fr.gap;
      const IW = Math.max(W, Math.round(W / kOut)), IH = Math.round(IW * H / W);
      const q = IW * kOut / W;                           // ara tuval pikseli / kaynak pikseli
      c.width = IW; c.height = IH;
      x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingQuality = "high";
      x.fillStyle = bg; x.fillRect(0, 0, IW, IH);
      x.translate(IW / 2, fr.eyePct * IH); x.rotate(-ang); x.scale(q, q); x.translate(-(ex + tx), -(ey + ty));
      x.drawImage(it.cut, 0, 0);
      x.setTransform(1, 0, 0, 1, 0, 0);
    } else {
      // Yüz bulunamazsa eski yöntem: silüetin tepesinden kadraj
      const topPct = 0.09;
      const { y0, P, cx } = it.info;
      let Hc = P / (1 - topPct) / zoom, Wc = Hc * W / H;
      const fit = Math.min(1, it.cut.width / Wc, it.cut.height / Hc);   // kadraj fotoğraftan büyükse küçült
      Hc *= fit; Wc *= fit;
      const top = Math.min(Math.max(0, y0 - Hc * topPct), it.cut.height - Hc);
      const left = Math.min(Math.max(0, cx - Wc / 2), it.cut.width - Wc);
      c.width = Math.max(W, Math.round(Wc)); c.height = Math.max(H, Math.round(Hc));
      x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingQuality = "high";
      x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
      const k = c.height / Hc;
      x.drawImage(it.cut, -left * k, -top * k, it.cut.width * k, it.cut.height * k);
    }
    // 2) Lanczos3 ile tek adımda küçült (keskin ama tırtıksız; masaüstü programlarının kullandığı yöntem)
    const src = x.getImageData(0, 0, c.width, c.height);
    const f = document.createElement("canvas"); f.width = W; f.height = H;
    const fx = f.getContext("2d");
    fx.putImageData(lanczos(src, W, H), 0, 0);
    return f;
  }

  function lanczosTable(sn, dn) {
    const A = 3, s = sn / dn, fs = Math.max(1, s), sup = A * fs, tab = [];
    const L = t => { if (t === 0) return 1; if (t <= -A || t >= A) return 0; const p = Math.PI * t; return A * Math.sin(p) * Math.sin(p / A) / (p * p); };
    for (let d = 0; d < dn; d++) {
      const ctr = (d + 0.5) * s - 0.5, lo = Math.ceil(ctr - sup), hi = Math.floor(ctr + sup);
      const idx = [], w = []; let sum = 0;
      for (let j = lo; j <= hi; j++) { const v = L((j - ctr) / fs); if (!v) continue; idx.push(Math.min(sn - 1, Math.max(0, j))); w.push(v); sum += v; }
      for (let k = 0; k < w.length; k++) w[k] /= sum;
      tab.push([idx, w]);
    }
    return tab;
  }
  function lanczos(img, dw, dh) {
    const sw = img.width, sh = img.height, s = img.data;
    const tx = lanczosTable(sw, dw), ty = lanczosTable(sh, dh);
    const tmp = new Float32Array(dw * sh * 3);
    for (let y = 0; y < sh; y++) for (let dx = 0; dx < dw; dx++) {
      const [idx, w] = tx[dx]; let r = 0, g = 0, b = 0;
      for (let k = 0; k < idx.length; k++) { const p = (y * sw + idx[k]) * 4; r += s[p] * w[k]; g += s[p + 1] * w[k]; b += s[p + 2] * w[k]; }
      const q = (y * dw + dx) * 3; tmp[q] = r; tmp[q + 1] = g; tmp[q + 2] = b;
    }
    const out = new ImageData(dw, dh), o = out.data;
    for (let dy = 0; dy < dh; dy++) {
      const [idx, w] = ty[dy];
      for (let dx = 0; dx < dw; dx++) {
        let r = 0, g = 0, b = 0;
        for (let k = 0; k < idx.length; k++) { const q = (idx[k] * dw + dx) * 3; r += tmp[q] * w[k]; g += tmp[q + 1] * w[k]; b += tmp[q + 2] * w[k]; }
        const p = (dy * dw + dx) * 4; o[p] = r; o[p + 1] = g; o[p + 2] = b; o[p + 3] = 255;
      }
    }
    return out;
  }

  // hafif keskinleştirme (küçültmeden sonra detay geri gelir)
  function sharpen(x, W, H, a) {
    const img = x.getImageData(0, 0, W, H), s = img.data, o = new Uint8ClampedArray(s);
    for (let y = 1; y < H - 1; y++) for (let i = 1; i < W - 1; i++) {
      const p = (y * W + i) * 4;
      for (let ch = 0; ch < 3; ch++) {
        const v = s[p + ch] * (1 + 4 * a) - a * (s[p - 4 + ch] + s[p + 4 + ch] + s[p - W * 4 + ch] + s[p + W * 4 + ch]);
        o[p + ch] = v;
      }
    }
    img.data.set(o); x.putImageData(img, 0, 0);
  }

  // ---------- JPEG: 20-150 KB aralığı ----------
  const toBlob = (c, q) => new Promise(r => c.toBlob(r, "image/jpeg", q));
  async function padJpeg(blob, minBytes) {
    const src = new Uint8Array(await blob.arrayBuffer());
    let need = minBytes - src.length; if (need <= 0) return blob;
    const segs = [];
    while (need > 0) {
      const dl = Math.min(65533, Math.max(1, need - 4));
      const seg = new Uint8Array(4 + dl); seg[0] = 0xFF; seg[1] = 0xFE;
      seg[2] = (dl + 2) >> 8; seg[3] = (dl + 2) & 255; seg.fill(32, 4);
      segs.push(seg); need -= seg.length;
    }
    return new Blob([src.slice(0, 2), ...segs, src.slice(2)], { type: "image/jpeg" });
  }
  // e-Okul: 35x45 mm = 133x171 px (yaklaşık 96 dpi); JFIF yoğunluğunu buna ayarla
  async function setDpi(blob, dpi) {
    const b = new Uint8Array(await blob.arrayBuffer());
    if (b[2] === 0xFF && b[3] === 0xE0 && b[6] === 0x4A && b[7] === 0x46) {
      b[13] = 1; b[14] = dpi >> 8; b[15] = dpi & 255; b[16] = dpi >> 8; b[17] = dpi & 255;
      return new Blob([b], { type: "image/jpeg" });
    }
    return blob;
  }
  async function encode(c) {
    const MIN = 22 * 1024, MAX = 148 * 1024;
    let q = 1.0, b = await toBlob(c, q);
    if (b.size > MAX) {
      let lo = 0.3, hi = q;
      for (let i = 0; i < 8; i++) { const m = (lo + hi) / 2; const t = await toBlob(c, m); if (t.size > MAX) hi = m; else lo = m; }
      b = await toBlob(c, lo);
    }
    b = await setDpi(b, 96);
    if (b.size < MIN) b = await padJpeg(b, MIN);
    return b;
  }

  async function renderItem(it) {
    const [W, H] = $("#size").value.split("x").map(Number);
    const blob = await encode(render(it, W, H));
    if (it.url) URL.revokeObjectURL(it.url);
    it.blob = blob; it.url = URL.createObjectURL(blob);
    const ph = it.el.querySelector(".ph"); ph.innerHTML = ""; const im = new Image(); im.src = it.url; ph.appendChild(im);
    setSt(it, "tamam · " + Math.round(blob.size / 1024) + " KB" + (it.gap > 0.02 ? " · köşe boşluğu %" + Math.round(it.gap * 100) : ""), "ok");
  }

  let tm = null;
  function schedule() {
    clearTimeout(tm);
    tm = setTimeout(async () => {
      if (busy) return;
      const my = ++token;
      for (const it of items) { if (it.cut && my === token) await renderItem(it); }
    }, 250);
  }

  // ---------- toplu işlem ----------
  $("#start").onclick = async () => {
    if (busy || !items.length) return;
    busy = true; token++;
    $("#start").disabled = true; $("#zip").disabled = true; $("#share").disabled = true;
    try { if ($("#model").value === "rmbg") await loadRmbg(); else { await loadLib(); await warm(); } await loadFace(); } catch (e) { msg("Model yüklenemedi: " + e.message + " (internet bağlantısını kontrol et veya \"Eski motor\" seç)"); busy = false; $("#start").disabled = false; return; }
    let done = 0;
    for (const it of items) {
      if (!it.cut) {
        setSt(it, "işleniyor..."); msg((done + 1) + " / " + items.length + " işleniyor (" + ($("#model").value === "rmbg" ? rmDev : (cpuOnly ? "CPU" : "GPU")) + ")...");
        try {
          const src = await prepare(it.file);
          const out = await withTimeout(cutout(src), 90000);
          it.cut = await createImageBitmap(out);
          it.info = analyze(it.cut);
          try { it.face = await withTimeout(findFace(src), 15000); } catch (e) { console.warn("yüz", e); it.face = null; }
        } catch (e) { console.error(e); setSt(it, "hata", "er"); done++; prog(done / items.length); continue; }
      }
      await renderItem(it);
      if (!it.face) it.el.querySelector(".st").textContent += landmarker ? " · yüz bulunamadı" : " · yüz modeli yok";
      done++; prog(done / items.length); msg(done + " / " + items.length + " tamamlandı");
    }
    busy = false; $("#start").disabled = false;
    const ok = items.filter(i => i.blob).length;
    msg(ok + " fotoğraf hazır. Renk ve kadraj ayarını değiştirirsen anında yenilenir." + (faceErr ? " (" + faceErr + ")" : ""));
    $("#zip").disabled = !ok; $("#share").disabled = !ok;
  };

  // ---------- ZIP (sıkıştırmasız) ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function makeZip(files) {
    const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
    const now = new Date();
    const dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
    const dd = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
    for (const f of files) {
      const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      const lh = new DataView(new ArrayBuffer(30 + nm.length));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
      lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
      new Uint8Array(lh.buffer).set(nm, 30);
      parts.push(new Uint8Array(lh.buffer), f.data);
      const ch = new DataView(new ArrayBuffer(46 + nm.length));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
      ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
      new Uint8Array(ch.buffer).set(nm, 46); cen.push(new Uint8Array(ch.buffer));
      off += lh.byteLength + sz;
    }
    const cs = cen.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cs, true); end.setUint32(16, off, true);
    return new Blob([...parts, ...cen, new Uint8Array(end.buffer)], { type: "application/zip" });
  }
  function uniqueName(n, used) {
    if (!used.has(n)) { used.add(n); return n; }
    const b = n.replace(/\.jpg$/, ""); let i = 2; while (used.has(b + "_" + i + ".jpg")) i++;
    const r = b + "_" + i + ".jpg"; used.add(r); return r;
  }

  $("#zip").onclick = async () => {
    const used = new Set(), files = [];
    for (const it of items) if (it.blob) files.push({ name: uniqueName(it.name, used), data: new Uint8Array(await it.blob.arrayBuffer()) });
    const z = makeZip(files), a = document.createElement("a");
    a.href = URL.createObjectURL(z);
    a.download = "vesikalik_" + new Date().toISOString().slice(0, 10) + ".zip";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };

  $("#share").onclick = async () => {
    const used = new Set();
    const files = items.filter(i => i.blob).map(i => new File([i.blob], uniqueName(i.name, used), { type: "image/jpeg" }));
    try {
      if (navigator.canShare && navigator.canShare({ files })) await navigator.share({ files });
      else msg("Bu tarayıcı çoklu dosya paylaşımını desteklemiyor, ZIP'i kullan.");
    } catch (e) { if (e.name !== "AbortError") msg("Paylaşım hatası: " + e.message); }
  };
})();
</script>
